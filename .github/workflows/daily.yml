name: Daily Podcast Shorts Automation

on:
  schedule:
    # 9:00 AM IST (03:30 UTC)
    - cron: "30 3 * * *"
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  run-pipeline:
    # Ubuntu runners are free for public repos and almost never queue
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Previous Database
        uses: actions/download-artifact@v4
        with:
          name: sqlite-database
        continue-on-error: true # First run will have no artifact

      - name: Ensure ffmpeg is available
        run: |
          if command -v ffmpeg &> /dev/null; then
            echo "ffmpeg already installed: $(which ffmpeg)"
          else
            echo "Installing ffmpeg..."
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Ensure ImageMagick is available
        run: |
          if command -v magick &> /dev/null || command -v convert &> /dev/null; then
            echo "ImageMagick already installed"
          else
            echo "Installing ImageMagick..."
            sudo apt-get update -qq
            sudo apt-get install -y -qq imagemagick
          fi
          # Fix ImageMagick policy to allow text rendering for moviepy
          sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml || true
          # Set IMAGEMAGICK_BINARY for moviepy/wand compatibility
          MAGICK_BIN=$(which magick 2>/dev/null || which convert 2>/dev/null)
          echo "ImageMagick binary: $MAGICK_BIN"
          echo "IMAGEMAGICK_BINARY=$MAGICK_BIN" >> "$GITHUB_ENV"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -U yt-dlp
        continue-on-error: false

      - name: Show Download Strategy
        continue-on-error: true
        run: |
          python -c "import os,json; data=json.load(open('podcasts_list.json')); pods=data.get('india_top_10',[])+data.get('world_top_20',[]); n=sum(1 for p in pods if p.get('rss_feed')); print('RSS feeds: '+str(n)+'/'+str(len(pods))); print('RapidAPI: yes' if os.environ.get('RAPID_API_KEY') else 'RapidAPI: no')"
        env:
          RAPID_API_KEY: ${{ secrets.RAPID_API_KEY }}

      - name: Run Main Automation Script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RAPID_API_KEY: ${{ secrets.RAPID_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        run: |
          python main.py --run-id ${{ github.run_id }}

      - name: Upload Logs & Debug Info
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-logs
          path: logs/
          if-no-files-found: ignore

      - name: Upload Database Tracker Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sqlite-database
          path: podcast_automation.db
          if-no-files-found: ignore
