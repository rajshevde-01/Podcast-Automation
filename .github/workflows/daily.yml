name: Daily Podcast Shorts Automation

on:
  schedule:
    # 5:00 PM IST (11:30 UTC)
    - cron: "30 11 * * *"
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  run-pipeline:
    # Self-hosted runner uses your residential IP — no YouTube bot-detection
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Previous Database
        uses: actions/download-artifact@v4
        with:
          name: sqlite-database
        continue-on-error: true # First run will have no artifact

      - name: Ensure ffmpeg is available
        run: |
          $ffmpegCheck = Get-Command ffmpeg -ErrorAction SilentlyContinue
          if ($ffmpegCheck) {
            Write-Host "ffmpeg already installed: $($ffmpegCheck.Source)"
          } else {
            $existingBin = Get-ChildItem "C:\ffmpeg\ffmpeg-*-essentials_build\bin" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($existingBin) {
              Write-Host "ffmpeg found at $($existingBin.FullName)"
              echo "$($existingBin.FullName)" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            } else {
              Write-Host "ffmpeg not found, downloading..."
              $zipUrl = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
              $zipPath = "$env:TEMP\ffmpeg.zip"
              Invoke-WebRequest -Uri $zipUrl -OutFile $zipPath -UseBasicParsing
              Expand-Archive -Path $zipPath -DestinationPath "C:\ffmpeg" -Force
              $binDir = Get-ChildItem "C:\ffmpeg\ffmpeg-*-essentials_build\bin" -Directory | Select-Object -First 1
              Write-Host "ffmpeg installed to $($binDir.FullName)"
              echo "$($binDir.FullName)" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }

      - name: Ensure ImageMagick is available
        run: |
          $magickCheck = Get-Command magick -ErrorAction SilentlyContinue
          if ($magickCheck) {
            Write-Host "ImageMagick already installed: $($magickCheck.Source)"
          } else {
            $existingDir = "C:\ImageMagick"
            $magickExe = Get-ChildItem "$existingDir\magick.exe" -ErrorAction SilentlyContinue
            if ($magickExe) {
              Write-Host "ImageMagick found at $existingDir"
            } else {
              Write-Host "ImageMagick not found, downloading portable..."
              $zipUrl = "https://imagemagick.org/archive/binaries/ImageMagick-7.1.1-47-portable-Q16-HDRI-x64.zip"
              $zipPath = "$env:TEMP\imagemagick.zip"
              Invoke-WebRequest -Uri $zipUrl -OutFile $zipPath -UseBasicParsing
              New-Item -ItemType Directory -Force -Path $existingDir | Out-Null
              Expand-Archive -Path $zipPath -DestinationPath $existingDir -Force
              Write-Host "ImageMagick installed to $existingDir"
            }
            echo "$existingDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            echo "IMAGEMAGICK_BINARY=$existingDir\magick.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -U yt-dlp
        continue-on-error: false

      - name: Show Download Strategy
        continue-on-error: true
        run: |
          python -c "import os,json; data=json.load(open('podcasts_list.json')); pods=data.get('india_top_10',[])+data.get('world_top_20',[]); n=sum(1 for p in pods if p.get('rss_feed')); print('RSS feeds: '+str(n)+'/'+str(len(pods))); print('RapidAPI: yes' if os.environ.get('RAPID_API_KEY') else 'RapidAPI: no')"
        env:
          RAPID_API_KEY: ${{ secrets.RAPID_API_KEY }}

      - name: Run Main Automation Script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RAPID_API_KEY: ${{ secrets.RAPID_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        run: |
          python main.py --run-id ${{ github.run_id }}

      - name: Upload Logs & Debug Info
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-logs
          path: logs/
          if-no-files-found: ignore

      - name: Upload Database Tracker Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sqlite-database
          path: podcast_automation.db
          if-no-files-found: ignore
